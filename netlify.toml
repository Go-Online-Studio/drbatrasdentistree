# ==============================================
# Dr. Batra's Dentistree — Netlify Configuration
# Canonical Domain: https://drbatrasdentistree.in
# ==============================================

# Redirect www to non-www
[[redirects]]
  from = "https://www.drbatrasdentistree.in/*"
  to = "https://drbatrasdentistree.in/:splat"
  status = 301
  force = true

# Redirect old .com domain
[[redirects]]
  from = "https://drbatrasdentistree.com/*"
  to = "https://drbatrasdentistree.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.drbatrasdentistree.com/*"
  to = "https://drbatrasdentistree.in/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
